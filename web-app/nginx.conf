server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config must never be cached: it is regenerated at container
    # start and points the app at this deployment's API / LiveKit URLs.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path returns the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
